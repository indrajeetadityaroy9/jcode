[build]
# Set RUSTC_WRAPPER=sccache in your shell env; no hardcoded path needed.
# CI overrides this file, so leaving rustc-wrapper unset here is safe.
# Local fast-linker selection is handled by scripts/dev_cargo.sh so we don't
# hard-force a linker mode that may be broken on a contributor machine.
#
# This is a conservative *static fallback* for direct `cargo` invocations. The
# recommended build path (selfdev build -> scripts/dev_cargo.sh) ignores this
# and instead sizes the job count from currently-available memory, so several
# concurrent builds on one machine self-throttle instead of all assuming the
# full core count and tripping earlyoom/OOM. Override either path explicitly
# with CARGO_BUILD_JOBS / JCODE_BUILD_JOBS.
#
# The largest rustc unit (jcode-base) peaks at ~1.6 GiB RSS (was 2.5-3 GiB as a
# monolith), so 4 jobs (~6-7 GiB) keeps a single direct build comfortably
# memory-safe on a ~15 GiB machine while staying parallel. The adaptive
# dev_cargo.sh path uses more cores when memory allows.
jobs = 4

[env]
# `pcre2-sys`'s build script links Homebrew's `libpcre2-8.dylib` whenever
# pkg-config finds one, which silently turns the grep tool's PCRE2 engine into
# a runtime dependency on a Homebrew formula. Force the vendored static build so
# the installed binary keeps working across `brew upgrade` and on machines
# without the formula. Verify with `otool -L <binary> | grep pcre` -> no match.
PCRE2_SYS_STATIC = "1"

# One test thread per test binary. jcode's test suites read and write
# process-global state - `JCODE_HOME`-derived paths, the config cache, the
# provider context-limit cache, the TUI's render-state globals - so tests in a
# single binary are only isolated from each other when they run one at a time.
# Cargo still runs the crates' test binaries in parallel (separate processes,
# separate globals), so the wall-clock cost is small: jcode-tui measures 43s
# serialized vs 22s at full parallelism, in exchange for a suite that reports
# the same result every run instead of a shifting handful of races.
#
# Individual tests that need shared state still take
# `jcode_base::storage::lock_test_env()`; that guard is what makes nested
# helpers safe, and it is required for the `test-support` feature consumers
# that do run threaded.
RUST_TEST_THREADS = "1"
