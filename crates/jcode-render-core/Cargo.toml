[package]
name = "jcode-render-core"
version = "0.1.0"
edition = "2024"
publish = false

# Backend-neutral text-rendering primitives shared by the TUI crates and by
# jcode-base. Holds LaTeX math layout, math/currency preprocessing, reasoning
# line markup, and the shared table Alignment. It has NO dependency on
# ratatui, so the foundation layer can use it too.

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
