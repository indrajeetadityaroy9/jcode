[package]
name = "jcode-transport"
version = "0.1.0"
edition = "2024"
publish = false
description = "Local IPC transport over Unix domain sockets"

# Deliberately tiny. This exists so the harness API bridge can speak local IPC
# without depending on `jcode-base`: the bridge is meant to stay free of the
# application foundation.
[dependencies]
tokio = { version = "1", features = ["io-util", "net", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
